<svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Padel court">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d3b32"/>
      <stop offset="0.55" stop-color="#0a2c2a"/>
      <stop offset="1" stop-color="#071f20"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fe8c5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#35d49c" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- surface -->
  <rect x="8" y="8" width="784" height="384" rx="10" fill="url(#surface)"/>

  <!-- glass wall frame -->
  <rect x="8" y="8" width="784" height="384" rx="10" stroke="#3a6f63" stroke-width="4" opacity="0.7"/>
  <rect x="30" y="30" width="740" height="340" rx="4" stroke="url(#glow)" stroke-width="2.5" opacity="0.85"/>

  <!-- service lines (parallel to the net) -->
  <line x1="150" y1="30" x2="150" y2="370" stroke="url(#glow)" stroke-width="2" opacity="0.8"/>
  <line x1="650" y1="30" x2="650" y2="370" stroke="url(#glow)" stroke-width="2" opacity="0.8"/>

  <!-- centre service line -->
  <line x1="150" y1="200" x2="650" y2="200" stroke="url(#glow)" stroke-width="2" opacity="0.65"/>

  <!-- net -->
  <line x1="400" y1="20" x2="400" y2="380" stroke="#eafff7" stroke-width="3" opacity="0.95"/>
  <g stroke="#eafff7" stroke-width="1" opacity="0.35">
    <line x1="388" y1="30" x2="388" y2="370"/>
    <line x1="412" y1="30" x2="412" y2="370"/>
  </g>
  <g stroke="#eafff7" stroke-width="0.6" opacity="0.25">
    <line x1="388" y1="60" x2="412" y2="60"/>
    <line x1="388" y1="100" x2="412" y2="100"/>
    <line x1="388" y1="140" x2="412" y2="140"/>
    <line x1="388" y1="180" x2="412" y2="180"/>
    <line x1="388" y1="220" x2="412" y2="220"/>
    <line x1="388" y1="260" x2="412" y2="260"/>
    <line x1="388" y1="300" x2="412" y2="300"/>
    <line x1="388" y1="340" x2="412" y2="340"/>
  </g>
</svg>
